<text x="80" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#0B2545" font-weight="bold" text-anchor="start" >Azure Key Vault connector for DigiCert Trust Lifecycle Manager</text>
<text x="80" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#5B6573" font-weight="normal" text-anchor="start" >A custom extensibility plugin lets TLM discover, issue and renew certificates inside a vault. The private key never leaves Azure.</text>
